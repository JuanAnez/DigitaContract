# Azure AD Configuration (Real)
azure.activedirectory.tenant-id=your-tenant-id
azure.activedirectory.client-id=your-client-id
azure.activedirectory.client-secret=your-client-secret
azure.activedirectory.redirect-uri=http://localhost:7001/contract/api/auth/azure/callback

# Real Azure AD endpoints
azure.activedirectory.authorization-url=https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/authorize
azure.activedirectory.token-url=https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
azure.activedirectory.user-info-url=https://graph.microsoft.com/v1.0/me
azure.activedirectory.logout-url=https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/logout



